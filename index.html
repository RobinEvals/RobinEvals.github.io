<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, user-scalable=yes, viewport-fit=cover">
    <title>TheIsle网页皮肤编辑器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg: #1a1e2b;
            --panel-bg: #212838;
            --text: #e3e9f2;
            --text-secondary: #a6b7d4;
            --input-bg: #141a26;
            --row-bg: #232a3a;
            --border: #3a4055;
            --accent: #f7b05e;
            --accent-hover: #f7a147;
            --danger: #CC6C79;
            --safe: #8FCA5B;
            --mixed: #E8C08D;
            --code-bg: #0b0f1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 1.5rem;
            color: var(--text);
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 2rem 2rem 2.2rem;
            width: 100%;
            max-width: 900px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: #f2e9c7;
            border-bottom: 1px solid rgba(255, 215, 150, 0.3);
            padding-bottom: 0.9rem;
        }

        h2 {
            font-size: 1.2rem;
            color: #cddaf5;
            margin: 1rem 0 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h3 {
            font-size: 1rem;
            color: #a6b7d4;
            margin: 0.8rem 0 0.5rem;
        }

        .section {
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .dino-selector, .preset-section, .gradient-section {
            margin: 1rem 0;
        }

        label {
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        select, input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            color: #f0f4ff;
            outline: none;
            transition: 0.2s;
            width: 100%;
            font-weight: 500;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(247, 176, 94, 0.25);
        }

        .dino-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .diet-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .colors-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--row-bg);
            padding: 0.5rem 1rem;
            border-radius: 1.5rem;
            flex-wrap: wrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .color-label {
            min-width: 120px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cddaf5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        .hex-input {
            flex: 2;
            min-width: 100px;
            background: #0f1322;
            border: 1px solid #434b62;
            border-radius: 1rem;
            padding: 0.65rem 0.9rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            background: #0f1322;
            border-radius: 1rem;
            padding: 0.15rem;
            border: 1px solid #434b62;
        }

        input[type="color"] {
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 0.8rem;
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #555;
            border-radius: 0.7rem;
        }

        .code-output {
            background: var(--code-bg);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin: 1rem 0;
            border: 1px solid #3d455c;
            word-break: break-all;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #d4dcf0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .code-text {
            flex: 1;
            line-height: 1.5;
            user-select: all;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background: #2f3854;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            color: #f0f4ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.25s;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }
        .btn-primary {
            background: #dd8030;
            color: #0b0f1a;
            border-color: var(--accent);
            font-weight: 700;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn:hover { background: #3f4a6b; border-color: var(--accent); }
        .btn:active { transform: scale(0.97); }

        .preset-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }

        .preset-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--row-bg);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .preset-bar:hover { border-color: var(--accent); }
        .preset-bar.active { border-color: var(--accent); background: #2f3854; }

        .preset-colors-preview {
            display: flex;
            gap: 3px;
        }
        .preset-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .gradient-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            margin: 0.5rem 0;
        }
        .gradient-input {
            flex: 1;
            min-width: 120px;
        }

        .gradient-results {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .gradient-swatch {
            width: 40px;
            height: 40px;
            border-radius: 0.5rem;
            border: 2px solid #555;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }
        .gradient-swatch:hover {
            transform: scale(1.15);
            border-color: var(--accent);
        }
        .gradient-swatch::after {
            content: attr(data-hex);
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: #aaa;
            white-space: nowrap;
        }

        .undo-redo-group {
            display: flex;
            gap: 0.3rem;
        }

        hr {
            border-color: rgba(255,255,255,0.08);
            margin: 1rem 0;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2c7a4a;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            z-index: 999;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            75% { opacity: 1; }
            100% { opacity: 0; }
        }

        .dino-select-option {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .diet-dot-inline {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .glass-panel { padding: 1.2rem; }
            .color-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1>🦕 恐龙岛 · 皮肤码生成器</h1>

        <!-- 恐龙选择 -->
        <div class="section dino-selector">
            <label>🦎 选择恐龙</label>
            <select id="dinosaurSelect"></select>
        </div>

        <!-- 预设配色方案选择 -->
        <div class="section">
            <label>🎨 快速套用配色方案（可选择任意恐龙的默认配色）</label>
            <select id="presetSchemeSelect">
                <option value="">-- 选择预设配色 --</option>
            </select>
            <div class="button-group" style="margin-top:0.5rem;">
                <button class="btn btn-sm" id="applyPresetSchemeBtn">应用此配色</button>
                <button class="btn btn-sm" id="resetToDinoDefaultBtn">🔄 重置为当前恐龙默认</button>
            </div>
        </div>

        <!-- 五个颜色输入 -->
        <div class="section">
            <label>🎨 颜色编辑</label>
            <div class="colors-grid" id="colorGrid"></div>
            <div class="button-group" style="margin-top:0.8rem;">
                <button class="btn btn-sm" id="solidColorBtn">🎯 一键纯色</button>
                <input type="color" id="solidColorPicker" value="#FFFFFF" style="width:38px;height:38px;padding:2px;" title="选择纯色">
                <div class="undo-redo-group">
                    <button class="btn btn-sm" id="undoBtn" title="撤销"><i class="fas fa-undo"></i></button>
                    <button class="btn btn-sm" id="redoBtn" title="重做"><i class="fas fa-redo"></i></button>
                </div>
            </div>
        </div>

        <!-- 生成的皮肤码 -->
        <div class="section">
            <label>📋 生成的皮肤码</label>
            <div class="code-output">
                <span class="code-text" id="skinCodeDisplay"></span>
                <button class="btn copy-btn" id="copyCodeBtn"><i class="far fa-copy"></i> 复制</button>
            </div>
            <small style="color:#7e8aa3;">格式：[恐龙名]010[肚皮][身体][侧腹][花纹][雄性展示] (每个颜色6位HEX+FF)</small>
        </div>

        <!-- 渐变色生成器 -->
        <div class="section gradient-section">
            <label>🌈 渐变色生成器（双色渐变）</label>
            <div class="gradient-row">
                <div class="gradient-input">
                    <label>颜色1</label>
                    <input type="color" id="gradColor1" value="#000000">
                    <input type="text" id="gradHex1" value="000000" maxlength="6" class="hex-input" style="margin-top:0.2rem;">
                </div>
                <div class="gradient-input">
                    <label>颜色2</label>
                    <input type="color" id="gradColor2" value="#FFFFFF">
                    <input type="text" id="gradHex2" value="FFFFFF" maxlength="6" class="hex-input" style="margin-top:0.2rem;">
                </div>
                <div class="gradient-input">
                    <label>渐变数量</label>
                    <input type="number" id="gradSteps" value="5" min="2" max="20" style="width:80px;">
                </div>
                <button class="btn btn-sm btn-primary" id="generateGradientBtn">生成</button>
            </div>
            <div class="gradient-results" id="gradientResults"></div>
        </div>

        <!-- 预设管理 -->
        <div class="section preset-section">
            <label>💾 皮肤预设 (本地存储，最多20个)</label>
            <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
                <input type="text" id="presetNameInput" placeholder="预设名称 (留空自动编号)" style="flex:2;">
                <button class="btn btn-sm btn-primary" id="savePresetBtn"><i class="fas fa-save"></i> 保存当前</button>
            </div>
            <div class="preset-list" id="presetList"></div>
            <button class="btn btn-sm" id="clearAllPresetsBtn" style="margin-top:0.5rem;"><i class="fas fa-trash"></i> 清空所有预设</button>
        </div>

        <div class="footer-note" style="text-align:center; margin-top:1rem;">
            <p style="color:#7e8aa3; font-size:0.8rem;">2026年5月5日压测版本皮肤码生成器</p>
            <p style="color:#CC6C79; font-size:0.75rem; margin-top:0.3rem;">⚠ 可能存在导入限制，请以游戏内显示情况为准</p>
        </div>
    </div>

    <script>
        (function() {
            // ============ 数据定义 ============
            const COLOR_PARTS = [
                { id: 'underbelly', label: '肚皮 Underbelly', defaultHex: '9D8D7C' },
                { id: 'body', label: '身体 Body', defaultHex: 'C08F78' },
                { id: 'flank', label: '侧腹 Flank', defaultHex: 'A16C60' },
                { id: 'markings', label: '花纹 Markings', defaultHex: '5D4343' },
                { id: 'maleDisplay', label: '雄性展示 Male Display', defaultHex: 'E78D60' }
            ];

            // 恐龙数据：名称、食性、默认颜色
            const DINOSAUR_DATA = {
                'Triceratops': {
                    name: '三角龙',
                    diet: 'herbivore',

                'Stegosaurus': {

                },
                'Maiasaura': {
                    name: '慈母龙',

                    colors: { underbelly:'FECF97', body:'EBB671', flank:'CA946A', markings:'5F4B43', maleDisplay:'AD8363' }
                },
                'Diabloceratops': {
                    name: '恶魔角龙',
                    diet: 'herbivore',
                    colors: { underbelly:'C5A78E', body:'AD9155', flank:'8B7953', markings:'635644', maleDisplay:'AD7C42' }
                },
                'Tenontosaurus': {

                    colors: { underbelly:'897258', body:'6C5541', flank:'4D3C33', markings:'382E2E', maleDisplay:'262325' }
                },
                'Pachycephalosaurus': {
                    name: '肿头龙',
                    diet: 'herbivore',
                    colors: { underbelly:'807C71', body:'6C635E', flank:'454A4D', markings:'2A2A2B', maleDisplay:'7C4538' }
                },
                'Dryosaurus': {
                    name: '橡树龙',
                    diet: 'herbivore',
                    colors: { underbelly:'A08265', body:'6C6C2F', flank:'434830', markings:'232B24', maleDisplay:'3C526C' }
                },
                'Hypsilophodon': {
                    name: '棱齿龙',
                    diet: 'herbivore',
                    colors: { underbelly:'4E4E4F', body:'D2AF44', flank:'C17126', markings:'2C251C', maleDisplay:'354370' }
                },
                'Kentrosaurus': {
                    name: '肯氏龙',
                    diet: 'herbivore',
                    colors: { underbelly:'BBAC97', body:'B5955D', flank:'5D534A', markings:'2E2A23', maleDisplay:'C75C2E' }
                },
                'Gallimimus': {
                    name: '似鸡龙',
                    diet: 'omnivore',
                    colors: { underbelly:'E2C69F', body:'D7AC6C', flank:'AA8160', markings:'69534F', maleDisplay:'557A6A' }
                },
                'Beipiaosaurus': {
                    name: '北票龙',
                    diet: 'omnivore',
                    colors: { underbelly:'342A2A', body:'A7A697', flank:'51515A', markings:'70707E', maleDisplay:'F2BE55' }
                },
                'Tyrannosaurus': {
                    name: '霸王龙',
                    diet: 'carnivore',
                    colors: { underbelly:'D3B48B', body:'897559', flank:'594934', markings:'342F29', maleDisplay:'6C3729' }
                },
                'Deinosuchus': {

                    diet: 'carnivore',
                    colors: { underbelly:'A09474', body:'6C5C41', flank:'3F3F3F', markings:'202020', maleDisplay:'59342B' }
                },
                'Allosaurus': {
                    name: '异特龙',
                    diet: 'carnivore',
                    colors: { underbelly:'FFE8C4', body:'F2C688', flank:'AA9382', markings:'55514B', maleDisplay:'B5646E' }
                },
                'Ceratosaurus': {
                    name: '角鼻龙',
                    diet: 'carnivore',
                    colors: { underbelly:'FFD6AA', body:'E7B289', flank:'C38F6C', markings:'775640', maleDisplay:'FF8600' }
                },
                'Carnotaurus': {
                    name: '食肉牛龙',
                    diet: 'carnivore',
                    colors: { underbelly:'AD9788', body:'A77F65', flank:'825A50', markings:'453B33', maleDisplay:'B05338' }
                },
                'Dilophosaurus': {
                    name: '双冠龙',
                    diet: 'carnivore',
                    colors: { underbelly:'9D8D7C', body:'C08F78', flank:'A16C60', markings:'5D4343', maleDisplay:'E78D60' }
                },
                'Omniraptor': {
                    name: '全能盗龙',
                    diet: 'carnivore',
                    colors: { underbelly:'AA987F', body:'89694A', flank:'6C4D41', markings:'38312C', maleDisplay:'956E3C' }
                },
                'Herrerasaurus': {
                    name: '埃雷拉龙',
                    diet: 'carnivore',
                    colors: { underbelly:'AAA382', body:'B0C35F', flank:'727F4D', markings:'4B5849', maleDisplay:'955556' }
                },
                'Pteranodon': {
                    name: '翼龙',
                    diet: 'carnivore',
                    colors: { underbelly:'BCB19E', body:'E1B05E', flank:'6C5F42', markings:'34302B', maleDisplay:'AAA288' }
                },
                'Troodon': {
                    name: '伤齿龙',
                    diet: 'carnivore',
                    colors: { underbelly:'C4A989', body:'957B5C', flank:'6C604E', markings:'2F2525', maleDisplay:'3E87BC' }
                },
                'Austroraptor': {
                    name: '南方盗龙',
                    diet: 'carnivore',
                    colors: { underbelly:'2C3334', body:'B5AFA7', flank:'8A6A50', markings:'4F3837', maleDisplay:'377D70' }
                }
            };

            const HANNIBAL_COLORS = {
                underbelly:'FFC0C1', body:'A8A8A8', flank:'DDD1CB', markings:'898989', maleDisplay:'8A5858'
            };

            const DIET_COLORS = { herbivore: '#8FCA5B', omnivore: '#E8C08D', carnivore: '#CC6C79' };
            const DIET_LABELS = { herbivore: '草食', omnivore: '杂食', carnivore: '肉食' };

            // ============ 状态管理 ============
            let currentDino = 'Dilophosaurus';
            let currentColors = { ...DINOSAUR_DATA['Dilophosaurus'].colors };
            let history = [];
            let historyIndex = -1;
            const MAX_HISTORY = 100;
            const MAX_PRESETS = 20;

            // ============ DOM元素 ============
            const dinosaurSelect = document.getElementById('dinosaurSelect');
            const skinCodeDisplay = document.getElementById('skinCodeDisplay');
            const copyBtn = document.getElementById('copyCodeBtn');
            const colorGrid = document.getElementById('colorGrid');
            const solidColorBtn = document.getElementById('solidColorBtn');
            const solidColorPicker = document.getElementById('solidColorPicker');
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            const applyPresetSchemeBtn = document.getElementById('applyPresetSchemeBtn');
            const presetSchemeSelect = document.getElementById('presetSchemeSelect');
            const resetToDinoDefaultBtn = document.getElementById('resetToDinoDefaultBtn');
            const savePresetBtn = document.getElementById('savePresetBtn');
            const presetNameInput = document.getElementById('presetNameInput');
            const presetList = document.getElementById('presetList');
            const clearAllPresetsBtn = document.getElementById('clearAllPresetsBtn');
            const generateGradientBtn = document.getElementById('generateGradientBtn');
            const gradientResults = document.getElementById('gradientResults');
            const gradColor1 = document.getElementById('gradColor1');
            const gradColor2 = document.getElementById('gradColor2');
            const gradHex1 = document.getElementById('gradHex1');
            const gradHex2 = document.getElementById('gradHex2');
            const gradSteps = document.getElementById('gradSteps');

            // ============ 初始化恐龙下拉列表（选项内带圆点） ============
            function initDinosaurSelect() {
                dinosaurSelect.innerHTML = '';
                const diets = { herbivore: [], omnivore: [], carnivore: [] };
                for (const [key, data] of Object.entries(DINOSAUR_DATA)) {
                    diets[data.diet].push({ key, name: data.name });
                }

                for (const [diet, dinos] of Object.entries(diets)) {
                    if (dinos.length === 0) continue;
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = `── ${DIET_LABELS[diet]} ──`;
                    dinos.forEach(d => {
                        const option = document.createElement('option');
                        option.value = d.key;
                        // 使用特殊字符加空格模拟圆点效果
                        option.textContent = '● ' + d.name;
                        option.style.color = DIET_COLORS[diet];
                        option.setAttribute('data-diet', diet);
                        if (d.key === 'Dilophosaurus') option.selected = true;
                        optgroup.appendChild(option);
                    });
                    dinosaurSelect.appendChild(optgroup);
                }
            }

            // ============ 初始化预设配色下拉列表 ============
            function initPresetSchemeSelect() {
                presetSchemeSelect.innerHTML = '<option value="">-- 选择预设配色 --</option>';

                // 汉尼拔配色
                const hannibalGroup = document.createElement('optgroup');
                hannibalGroup.label = '── 特殊配色 ──';
                const hannibalOption = document.createElement('option');
                hannibalOption.value = 'hannibal';
                hannibalOption.textContent = '汉尼拔配色 (通用)';
                hannibalGroup.appendChild(hannibalOption);
                presetSchemeSelect.appendChild(hannibalGroup);

                // 按食性分组添加所有恐龙
                const diets = { herbivore: [], omnivore: [], carnivore: [] };
                for (const [key, data] of Object.entries(DINOSAUR_DATA)) {
                    diets[data.diet].push({ key, name: data.name });
                }

                for (const [diet, dinos] of Object.entries(diets)) {
                    if (dinos.length === 0) continue;
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = `── ${DIET_LABELS[diet]}恐龙配色 ──`;
                    dinos.forEach(d => {
                        const option = document.createElement('option');
                        option.value = 'dino_' + d.key;
                        option.textContent = d.name;
                        optgroup.appendChild(option);
                    });
                    presetSchemeSelect.appendChild(optgroup);
                }
            }

            // ============ 构建颜色输入界面 ============
            function buildColorInputs() {
                colorGrid.innerHTML = '';
                COLOR_PARTS.forEach(part => {
                    const hexValue = currentColors[part.id] || part.defaultHex;
                    const row = document.createElement('div');
                    row.className = 'color-row';
                    row.innerHTML = `
                        <span class="color-label">
                            <span class="color-swatch" style="background-color:#${hexValue};" id="swatch_${part.id}"></span>
                            ${part.label}
                        </span>
                        <input type="text" class="hex-input" id="hex_${part.id}" value="${hexValue}" maxlength="6" placeholder="HEX" autocomplete="off">
                        <div class="color-picker-wrapper">
                            <input type="color" id="picker_${part.id}" value="#${hexValue}">
                        </div>
                    `;
                    colorGrid.appendChild(row);

                    const hexInput = row.querySelector(`#hex_${part.id}`);
                    const colorPicker = row.querySelector(`#picker_${part.id}`);
                    const swatch = row.querySelector(`#swatch_${part.id}`);

                    hexInput.addEventListener('input', function(e) {
                        let val = e.target.value.replace(/[^0-9A-Fa-f]/g, '').toUpperCase().slice(0, 6);
                        e.target.value = val;
                        if (val.length === 6 && /^[0-9A-F]{6}$/.test(val)) {
                            currentColors[part.id] = val;
                            colorPicker.value = '#' + val;
                            swatch.style.backgroundColor = '#' + val;
                            updateSkinCode();
                            saveToHistory();
                        }
                    });

                    hexInput.addEventListener('blur', function() {
                        let val = hexInput.value.trim();
                        if (val.length !== 6 || !/^[0-9A-F]{6}$/i.test(val)) {
                            hexInput.value = currentColors[part.id];
                        } else {
                            val = val.toUpperCase();
                            hexInput.value = val;
                            currentColors[part.id] = val;
                            colorPicker.value = '#' + val;
                            swatch.style.backgroundColor = '#' + val;
                            updateSkinCode();
                            saveToHistory();
                        }
                    });

                    colorPicker.addEventListener('input', function() {
                        const hex = this.value.replace('#', '').toUpperCase();
                        hexInput.value = hex;
                        currentColors[part.id] = hex;
                        swatch.style.backgroundColor = '#' + hex;
                        updateSkinCode();
                        saveToHistory();
                    });
                });
            }

            function updateAllColorInputs() {
                COLOR_PARTS.forEach(part => {
                    const hexInput = document.getElementById(`hex_${part.id}`);
                    const picker = document.getElementById(`picker_${part.id}`);
                    const swatch = document.getElementById(`swatch_${part.id}`);
                    const hex = currentColors[part.id];
                    if (hexInput) hexInput.value = hex;
                    if (picker) picker.value = '#' + hex;
                    if (swatch) swatch.style.backgroundColor = '#' + hex;
                });
            }

            // ============ 生成皮肤码 ============
            function generateSkinCode() {
                const dino = currentDino;
                const colorString =
                    currentColors.underbelly + 'FF' +
                    currentColors.body + 'FF' +
                    currentColors.flank + 'FF' +
                    currentColors.markings + 'FF' +
                    currentColors.maleDisplay + 'FF';
                return `${dino}010${colorString}`;
            }

            function updateSkinCode() {
                skinCodeDisplay.textContent = generateSkinCode();
            }

            // ============ 历史记录 (Undo/Redo) ============
            function saveToHistory() {
                const state = JSON.stringify(currentColors);
                history = history.slice(0, historyIndex + 1);
                history.push(state);
                if (history.length > MAX_HISTORY) history.shift();
                historyIndex = history.length - 1;
                updateUndoRedoButtons();
            }

            function undo() {
                if (historyIndex > 0) {
                    historyIndex--;
                    currentColors = JSON.parse(history[historyIndex]);
                    updateAllColorInputs();
                    updateSkinCode();
                }
                updateUndoRedoButtons();
            }

            function redo() {
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    currentColors = JSON.parse(history[historyIndex]);
                    updateAllColorInputs();
                    updateSkinCode();
                }
                updateUndoRedoButtons();
            }

            function updateUndoRedoButtons() {
                undoBtn.style.opacity = historyIndex > 0 ? '1' : '0.4';
                redoBtn.style.opacity = historyIndex < history.length - 1 ? '1' : '0.4';
            }

            function initHistory() {
                history = [JSON.stringify(currentColors)];
                historyIndex = 0;
                updateUndoRedoButtons();
            }

            // ============ 恐龙切换 ============
            function switchDinosaur(dinoKey) {
                currentDino = dinoKey;
                const data = DINOSAUR_DATA[dinoKey];
                if (data && data.colors) {
                    currentColors = { ...data.colors };
                }
                updateAllColorInputs();
                updateSkinCode();
                saveToHistory();
            }

            function applyPresetColors(colorsObj) {
                currentColors = { ...colorsObj };
                updateAllColorInputs();
                updateSkinCode();
                saveToHistory();
            }

            // ============ 一键纯色 ============
            function applySolidColor(hex) {
                const c = hex.toUpperCase().replace('#', '');
                if (c.length === 6 && /^[0-9A-F]{6}$/.test(c)) {
                    currentColors = {
                        underbelly: c, body: c, flank: c, markings: c, maleDisplay: c
                    };
                    updateAllColorInputs();
                    updateSkinCode();
                    saveToHistory();
                }
            }

            // ============ 渐变色生成 ============
            function hexToRgb(hex) {
                return {
                    r: parseInt(hex.slice(0,2), 16),
                    g: parseInt(hex.slice(2,4), 16),
                    b: parseInt(hex.slice(4,6), 16)
                };
            }
            function rgbToHex(r, g, b) {
                return [r,g,b].map(x => Math.round(x).toString(16).padStart(2,'0').toUpperCase()).join('');
            }
            function generateGradient(hex1, hex2, steps) {
                const c1 = hexToRgb(hex1);
                const c2 = hexToRgb(hex2);
                const results = [];
                for (let i = 0; i < steps; i++) {
                    const t = steps === 1 ? 0 : i / (steps - 1);
                    const r = c1.r + (c2.r - c1.r) * t;
                    const g = c1.g + (c2.g - c1.g) * t;
                    const b = c1.b + (c2.b - c1.b) * t;
                    results.push(rgbToHex(r, g, b));
                }
                return results;
            }

            function displayGradientResults(colors) {
                gradientResults.innerHTML = '';
                colors.forEach(hex => {
                    const swatch = document.createElement('div');
                    swatch.className = 'gradient-swatch';
                    swatch.style.backgroundColor = '#' + hex;
                    swatch.setAttribute('data-hex', hex);
                    swatch.title = '点击复制 ' + hex;
                    swatch.addEventListener('click', () => {
                        copyToClipboard(hex);
                        showToast('已复制: ' + hex);
                    });
                    gradientResults.appendChild(swatch);
                });
            }

            // ============ 预设管理 (本地存储) - 不保存恐龙种类 ============
            function getPresets() {
                try {
                    const data = localStorage.getItem('isle_skin_presets_v2');
                    return data ? JSON.parse(data) : [];
                } catch(e) {
                    return [];
                }
            }

            function savePresets(presets) {
                try {
                    localStorage.setItem('isle_skin_presets_v2', JSON.stringify(presets));
                } catch(e) {
                    showToast('存储空间不足，请清理一些预设');
                }
            }

            function addPreset(name, colors) {
                const presets = getPresets();
                if (presets.length >= MAX_PRESETS) {
                    showToast('预设已达上限 (20个)，请先删除旧预设');
                    return;
                }
                if (!name || name.trim() === '') {
                    name = String(presets.length + 1);
                }
                // 不保存恐龙种类，只保存颜色
                presets.push({ name: name.trim(), colors: { ...colors }, timestamp: Date.now() });
                savePresets(presets);
                renderPresets();
            }

            function deletePreset(index) {
                const presets = getPresets();
                if (index >= 0 && index < presets.length) {
                    presets.splice(index, 1);
                    savePresets(presets);
                    renderPresets();
                }
            }

            function loadPreset(index) {
                const presets = getPresets();
                if (index >= 0 && index < presets.length) {
                    const preset = presets[index];
                    currentColors = { ...preset.colors };
                    // 加载预设时，不改变当前选择的恐龙
                    updateAllColorInputs();
                    updateSkinCode();
                    saveToHistory();
                    showToast('已加载预设: ' + preset.name);
                }
            }

            function renderPresets() {
                const presets = getPresets();
                presetList.innerHTML = '';
                if (presets.length === 0) {
                    presetList.innerHTML = '<span style="color:#7e8aa3; font-size:0.85rem;">暂无保存的预设</span>';
                    return;
                }
                presets.forEach((preset, index) => {
                    const bar = document.createElement('div');
                    bar.className = 'preset-bar';
                    const dots = COLOR_PARTS.map(p =>
                        `<span class="preset-color-dot" style="background-color:#${preset.colors[p.id] || '000'};"></span>`
                    ).join('');
                    bar.innerHTML = `
                        <span style="font-weight:600; min-width:50px;">${preset.name}</span>
                        <span class="preset-colors-preview">${dots}</span>
                        <button class="btn btn-sm" onclick="event.stopPropagation(); deletePresetById(${index})" title="删除" style="padding:0.2rem 0.5rem; margin-left:auto;">✕</button>
                    `;
                    bar.addEventListener('click', () => loadPreset(index));
                    presetList.appendChild(bar);
                });
            }

            window.deletePresetById = function(index) {
                deletePreset(index);
            };

            // ============ 复制与提示 ============
            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast('已复制!'));
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('已复制!');
                }
            }

            function showToast(msg) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }

            // ============ 事件绑定 ============
            dinosaurSelect.addEventListener('change', function() {
                switchDinosaur(this.value);
            });

            solidColorBtn.addEventListener('click', function() {
                applySolidColor(solidColorPicker.value);
            });

            undoBtn.addEventListener('click', undo);
            redoBtn.addEventListener('click', redo);

            applyPresetSchemeBtn.addEventListener('click', function() {
                const scheme = presetSchemeSelect.value;
                if (scheme === 'hannibal') {
                    applyPresetColors(HANNIBAL_COLORS);
                    showToast('已应用汉尼拔配色');
                } else if (scheme.startsWith('dino_')) {
                    const dinoKey = scheme.replace('dino_', '');
                    const data = DINOSAUR_DATA[dinoKey];
                    if (data && data.colors) {
                        applyPresetColors(data.colors);
                        showToast('已应用 ' + data.name + ' 的配色');
                    }
                }
            });

            resetToDinoDefaultBtn.addEventListener('click', function() {
                const data = DINOSAUR_DATA[currentDino];
                if (data && data.colors) {
                    applyPresetColors(data.colors);
                    showToast('已重置为 ' + data.name + ' 默认配色');
                }
            });

            savePresetBtn.addEventListener('click', function() {
                let name = presetNameInput.value.trim();
                addPreset(name, currentColors);  // 不再传入恐龙种类
                presetNameInput.value = '';
                showToast('预设已保存!');
            });

            clearAllPresetsBtn.addEventListener('click', function() {
                if (confirm('确定要清空所有预设吗？此操作不可恢复。')) {
                    savePresets([]);
                    renderPresets();
                    showToast('所有预设已清空');
                }
            });

            generateGradientBtn.addEventListener('click', function() {
                const h1 = gradHex1.value.trim().toUpperCase();
                const h2 = gradHex2.value.trim().toUpperCase();
                const steps = parseInt(gradSteps.value) || 5;
                if (h1.length === 6 && h2.length === 6 && /^[0-9A-F]{6}$/.test(h1) && /^[0-9A-F]{6}$/.test(h2)) {
                    const colors = generateGradient(h1, h2, Math.max(2, Math.min(20, steps)));
                    displayGradientResults(colors);
                } else {
                    showToast('请输入有效的6位HEX颜色值');
                }
            });

            // 渐变色输入同步
            gradColor1.addEventListener('input', function() {
                gradHex1.value = this.value.replace('#','').toUpperCase();
            });
            gradColor2.addEventListener('input', function() {
                gradHex2.value = this.value.replace('#','').toUpperCase();
            });
            gradHex1.addEventListener('input', function() {
                let val = this.value.replace(/[^0-9A-Fa-f]/g,'').toUpperCase().slice(0,6);
                this.value = val;
                if (val.length === 6) gradColor1.value = '#' + val;
            });
            gradHex2.addEventListener('input', function() {
                let val = this.value.replace(/[^0-9A-Fa-f]/g,'').toUpperCase().slice(0,6);
                this.value = val;
                if (val.length === 6) gradColor2.value = '#' + val;
            });

            copyBtn.addEventListener('click', function() {
                const code = skinCodeDisplay.textContent.trim();
                if (code) copyToClipboard(code);
            });

            // 键盘快捷键 Ctrl+Z / Ctrl+Y
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                    e.preventDefault();
                    redo();
                }
            });

            // ============ 初始化 ============
            function init() {
                initDinosaurSelect();
                initPresetSchemeSelect();
                dinosaurSelect.value = 'Dilophosaurus';
                currentDino = 'Dilophosaurus';
                currentColors = { ...DINOSAUR_DATA['Dilophosaurus'].colors };
                buildColorInputs();
                updateSkinCode();
                initHistory();
                renderPresets();
                const initGrad = generateGradient('000000', 'FFFFFF', 5);
                displayGradientResults(initGrad);
            }

            init();
        })();
    </script>
</body>
</html>
